 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy</title>

<style>
    body{
        background-color: #f4f6fb;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    .header{
        background-color: #222;
        color: white;
        padding: 15px;
        font-size: 28px;
        font-weight: bold;
    }
    .card{
        width: 350px;
        background: white;
        margin: 40px auto;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
        text-align: left;
    }
    .card img{
        width: 100%;
        border-radius: 8px;
    }
    .price{
        color: green;
        font-weight: bold;
        font-size: 20px;
    }
    .old-price{
        color: gray;
        text-decoration: line-through;
    }
    .btn{
        width: 100%;
        background-color: #0d6efd;
        color: white;
        padding: 10px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="header">ShopEasy</div>

<div class="card">
    <img src="C:\Users\ANSHIKA\Pictures\WhatsApp Image 2025-11-12 at 09.33.23_fee37939.jpg" alt="T-shirt">
    <h3>Classic Cotton T-Shirt</h3>
    <p>Soft, breathable cotton. Regular fit. Available in multiple colors.</p>
    <span class="price">₹799</span> &nbsp;
    <span class="old-price">₹1,199</span>
    <button class="btn">Add to Cart</button>
</div>

</body>
</html>
